<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f5fa" />
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme')
        document.documentElement.dataset.theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta
      name="description"
      content="Dan Carlo Magpantay is a Mobile Software Engineer building Android and iOS apps with Kotlin Multiplatform, React Native, and modern mobile tools."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Dan Carlo Magpantay — Mobile Software Engineer"
    />
    <meta
      property="og:description"
      content="Mobile Software Engineer focused on Android, iOS, Kotlin Multiplatform, React Native, integrations, and maintainable mobile software."
    />
    <meta property="og:image" content="/profile.webp" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dan Carlo Magpantay — Mobile Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
