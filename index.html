<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#f2f4f7" />
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme')
        document.documentElement.dataset.theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta
      name="description"
      content="Dan Carlo Magpantay is a Software Engineer specializing in Android development, with professional experience in commercial Android POS and business applications, while also building iOS mobile applications and websites."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Dan Carlo Magpantay — Software Engineer & Android Developer"
    />
    <meta
      property="og:description"
      content="Software Engineer with Android development as primary specialization and current professional experience, also building iOS mobile applications and websites."
    />
    <meta property="og:image" content="/profile.webp" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <title>Dan Carlo Magpantay — Software Engineer & Android Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
