<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-base" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a303c" />
      <stop offset="100%" stop-color="#171a21" />
    </linearGradient>
    <linearGradient id="glass-pane" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="glass-rim" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="monogram" x1="18" y1="16" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3f5f8" />
      <stop offset="100%" stop-color="#c8d0dc" />
    </linearGradient>
  </defs>

  <!-- Outer matte slate squircle -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bg-base)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />

  <!-- Subtle ambient light orb behind glass -->
  <circle cx="20" cy="18" r="14" fill="#9aa3b2" fill-opacity="0.18" />

  <!-- Tilted back glass layer -->
  <rect
    x="13"
    y="11"
    width="38"
    height="42"
    rx="12"
    transform="rotate(-6 32 32)"
    fill="#ffffff"
    fill-opacity="0.06"
    stroke="#ffffff"
    stroke-opacity="0.12"
    stroke-width="1"
  />

  <!-- Primary frosted glass card -->
  <rect
    x="10"
    y="10"
    width="44"
    height="44"
    rx="13"
    fill="url(#glass-pane)"
    stroke="url(#glass-rim)"
    stroke-width="1.25"
  />

  <!-- Top glass specular highlight bar -->
  <path d="M20 13.5h24" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.5" stroke-linecap="round" />

  <!-- Crisp geometric "D" monogram -->
  <path
    d="M19 19h11.5C38.5 19 44 24.4 44 32s-5.5 13-13.5 13H19V19Zm7.2 6.4v13.2h3.8c4.3 0 6.8-2.6 6.8-6.6s-2.5-6.6-6.8-6.6h-3.8Z"
    fill="url(#monogram)"
    fill-rule="evenodd"
  />

  <!-- Subtle status / period dot -->
  <circle cx="46.5" cy="41.5" r="3.5" fill="#639a7d" stroke="#f3f5f8" stroke-opacity="0.35" stroke-width="1" />
</svg>
